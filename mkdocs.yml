site_name: MRSplotter
site_description: Open source software for visualizing and generating publication-ready plots from processed 1H MRS data.
site_author: Lili Fanni Tóth
repo_url: https://github.com/lilively/MRSplotter
edit_uri: blob/main/docs/

theme:
  name: readthedocs
  navigation_depth: 2

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list

nav:
  - Home: index.md
  - Installation: installation.md
  - Loading data: loading-data.md
  - Selecting PPM range: ppm-filtering.md
  - Review, edit and export data window: data-editor.md
  - Labels panel: labels.md
  - Plot layouts: plotting.md
  - Toolbar: toolbar.md
  - Exporting: exporting.md
  - Examples: examples.md
  - References: references.md
